<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test KKiaPay Ultra Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { background: #0056b3; }
        #console {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🧪 Test KKiaPay Ultra Simple</h1>

    <div id="status" class="status info">
        ⏳ Chargement du SDK KKiaPay...
    </div>

    <button onclick="test1()">Test 1: Sandbox (sandbox=true)</button>
    <button onclick="test2()">Test 2: Sans sandbox parameter</button>
    <button onclick="test3()">Test 3: Sandbox string "true"</button>

    <div id="console">
        <strong>📊 Console de débogage</strong><br>
        <div id="logs"></div>
    </div>

    <!-- Chargement SDK KKiaPay simple -->
    <script src="https://cdn.kkiapay.me/k.js"></script>

    <script>
        function log(msg) {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            logs.innerHTML += `[${time}] ${msg}<br>`;
            logs.parentElement.scrollTop = logs.parentElement.scrollHeight;
            console.log(msg);
        }

        function updateStatus(msg, type = 'info') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = msg;
        }

        // Vérifier le chargement du SDK
        window.addEventListener('load', function() {
            log('📄 Page chargée');

            if (typeof openKkiapayWidget === 'function') {
                log('✅ openKkiapayWidget est disponible');
                updateStatus('✅ SDK KKiaPay chargé avec succès', 'success');
            } else {
                log('❌ openKkiapayWidget n\'est PAS disponible');
                updateStatus('❌ SDK KKiaPay non chargé !', 'error');
            }

            if (typeof addSuccessListener === 'function') {
                log('✅ addSuccessListener disponible');
            }

            if (typeof addFailedListener === 'function') {
                log('✅ addFailedListener disponible');
            }

            if (typeof addKkiapayListener === 'function') {
                log('✅ addKkiapayListener disponible (ancien format)');
            }

            // Configuration des listeners
            if (typeof addSuccessListener === 'function') {
                addSuccessListener(function(response) {
                    log('✅✅✅ SUCCÈS! Transaction: ' + response.transactionId);
                    updateStatus('✅ Paiement réussi! ID: ' + response.transactionId, 'success');
                    alert('Paiement réussi!\nTransaction ID: ' + response.transactionId);
                });
            }

            if (typeof addFailedListener === 'function') {
                addFailedListener(function(error) {
                    log('❌ ÉCHEC: ' + JSON.stringify(error));
                    updateStatus('❌ Paiement échoué', 'error');
                });
            }
        });

        // Test 1: Sandbox = true (boolean)
        function test1() {
            log('🚀 TEST 1: Sandbox boolean true');
            try {
                openKkiapayWidget({
                    amount: 100,
                    key: "40200980e80411f0996935de2ca9cc0f",
                    sandbox: true  // Boolean
                });
                log('✅ Widget appelé (sandbox: true)');
            } catch (error) {
                log('❌ ERREUR: ' + error.message);
                updateStatus('❌ Erreur: ' + error.message, 'error');
            }
        }

        // Test 2: Sans parameter sandbox
        function test2() {
            log('🚀 TEST 2: Sans parameter sandbox');
            try {
                openKkiapayWidget({
                    amount: 100,
                    key: "40200980e80411f0996935de2ca9cc0f"
                    // Pas de sandbox du tout
                });
                log('✅ Widget appelé (sans sandbox)');
            } catch (error) {
                log('❌ ERREUR: ' + error.message);
                updateStatus('❌ Erreur: ' + error.message, 'error');
            }
        }

        // Test 3: Sandbox = "true" (string)
        function test3() {
            log('🚀 TEST 3: Sandbox string "true"');
            try {
                openKkiapayWidget({
                    amount: 100,
                    key: "40200980e80411f0996935de2ca9cc0f",
                    sandbox: "true"  // String
                });
                log('✅ Widget appelé (sandbox: "true")');
            } catch (error) {
                log('❌ ERREUR: ' + error.message);
                updateStatus('❌ Erreur: ' + error.message, 'error');
            }
        }

        // Capturer les erreurs non gérées
        window.addEventListener('error', function(event) {
            log('❌ Erreur window: ' + event.message);
        });

        window.addEventListener('unhandledrejection', function(event) {
            log('❌ Promise rejected: ' + event.reason);
            updateStatus('❌ Erreur Promise: ' + event.reason, 'error');
        });
    </script>
</body>
</html>
